<body>
    <div class="auth-container">
        <div class="auth-card glass-panel fade-in-up">
            <a href="index.html"><img src="../empasy-logo.png" alt="EMPASY" class="auth-logo"></a>
            <h2 style="margin-bottom: 0.5rem; font-weight: 800;">コンソールログイン</h2>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;">最高のQAエンジニアエコシステムへようこそ。</p>
            
            <div class="social-login-group" style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem;">
                <button class="btn btn-outline" style="flex: 1; padding: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; border-color: #e5e7eb;">
                    <img src="https://www.google.com/favicon.ico" alt="Google" style="width: 18px;"> Google
                </button>
                <button class="btn btn-outline" style="flex: 1; padding: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; border-color: #e5e7eb;">
                    <img src="https://github.com/favicon.ico" alt="GitHub" style="width: 18px;"> GitHub
                </button>
            </div>
            
            <div style="display: flex; align-items: center; margin: 1.5rem 0; color: var(--text-secondary); font-size: 0.85rem;">
                <hr style="flex: 1; border: none; border-top: 1px solid var(--border-color);">
                <span style="padding: 0 1rem;">またはメールでログイン</span>
                <hr style="flex: 1; border: none; border-top: 1px solid var(--border-color);">
            </div>

            <form action="dashboard.html" method="GET">
                <div class="form-group">
                    <label for="email">会社のメール</label>
                    <input type="email" id="email" class="form-control" placeholder="work@company.com" required style="background: rgba(255,255,255,0.8);">
                </div>
                <div class="form-group">
                    <label for="password">パスワード</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required style="background: rgba(255,255,255,0.8);">
                </div>
                <button type="submit" class="btn btn-primary auth-btn" style="box-shadow: 0 4px 15px rgba(13, 148, 136, 0.3);">メールでログイン</button>
            </form>
            <div class="auth-links">
                アカウントをお持ちではありませんか？ <a href="signup.html">無料で登録する</a>
            </div>
        </div>
    </div>
    <script src="../js/main.js"></script>
    <script>
        // 안전장치: main.js의 IntersectionObserver가 실패해도 무조건 컨텐츠 노출
        setTimeout(() => {
