<!DOCTYPE html>
<html lang="ja">
<head>
    <title>お問い合わせ (Contact) | Empasy</title>
    <meta name="description" content="EmpasyのエンタープライズAIソリューションおよびテスト自動化ツールの導入に関するお問い合わせ。">
    <meta name="keywords" content="Empasy, お問い合わせ, エンタープライズAI, SyncSeries, SyncEta, SyncBoot, テスト自動化">
    <meta property="og:title" content="お問い合わせ (Contact) | Empasy">
    <meta property="og:description" content="EmpasyのエンタープライズAIソリューションおよびテスト自動化ツールの導入に関するお問い合わせ。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://empasy.io/ja/pages/contact.html">
    <meta property="og:image" content="https://empasy.io/empasy-logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="お問い合わせ (Contact) | Empasy">
    <meta name="twitter:description" content="EmpasyのエンタープライズAIソリューション導入に関するお問い合わせ。">
    <meta name="twitter:image" content="https://empasy.io/empasy-logo.png">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        .page-header { padding: 150px 0 80px; text-align: center; }
        .page-title { font-size: 3rem; margin-bottom: 1rem; color: var(--text-primary); }
        .page-subtitle { font-size: 1.2rem; color: var(--text-secondary); max-width: 800px; margin: 0 auto; }
        .contact-form {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            padding: clamp(1.2rem, 5vw, 3rem);
            border-radius: var(--border-radius);
            max-width: 800px;
            margin: 0 auto 5rem;
        }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; margin-bottom: 0.5rem; color: #fff; font-weight: 600; }
        .form-control {
            width: 100%;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius-sm);
            color: #fff;
            font-family: inherit;
        }
        .form-control:focus { outline: none; border-color: var(--primary-color); background: rgba(0, 0, 0, 0.4); }
        textarea.form-control { min-height: 150px; resize: vertical; }
        .submit-btn { width: 100%; padding: 1rem; font-size: 1.1rem; margin-top: 1rem; }
    </style>
</head>
<body>
    {{> header_ja }}

    <main class="container">
        <div class="page-header fade-in-up">
            <h1 class="page-title">お問い合わせ</h1>
            <p class="page-subtitle">エンタープライズ環境に最適なソリューション導入とPoCの進め方をご案内いたします。</p>
            
            <div style="margin-top: 2rem; display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap;">
                <div style="background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 1rem 1.5rem; text-align: left; display: flex; align-items: center; gap: 12px;">
                    <span style="background: rgba(37, 99, 235, 0.2); color: #60a5fa; padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 0.85rem;">導入相談</span>
                    <a href="mailto:poh@empasy.com" style="color: #fff; font-weight: 600; text-decoration: none; font-size: 1.05rem;">poh@empasy.com</a>
                </div>
                <div style="background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 1rem 1.5rem; text-align: left; display: flex; align-items: center; gap: 12px;">
                    <span style="background: rgba(16, 185, 129, 0.2); color: #34d399; padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 0.85rem;">技術サポート</span>
                    <a href="tel:+82-507-1360-8169" style="color: #fff; font-weight: 600; text-decoration: none; font-size: 1.05rem;">+82-507-1360-8169</a>
                </div>
            </div>
        </div>

        <section class="section pt-0 fade-in-up delay-1">
            <div class="contact-form glass-card">
                <form id="contactForm">
                    <div class="grid grid-2">
                        <div class="form-group">
                            <label class="form-label" for="name">お名前 / 役職</label>
                            <input type="text" id="name" class="form-control" placeholder="山田 太郎 / チーム長" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="company">会社名</label>
                            <input type="text" id="company" class="form-control" placeholder="株式会社Empasy" required>
                        </div>
                    </div>
                    <div class="grid grid-2">
                        <div class="form-group">
                            <label class="form-label" for="email">メールアドレス</label>
                            <input type="email" id="email" class="form-control" placeholder="example@company.com" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="phone">電話番号</label>
                            <input type="tel" id="phone" class="form-control" placeholder="010-0000-0000" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="interest">ご関心のあるソリューション</label>
                        <select id="interest" class="form-control" style="background: rgba(0, 0, 0, 0.4);">
                            <option>全体（Sync Series 統合自律運用エコシステム）</option>
                            <option>SyncVerse（マルチエージェントA2Aオーケストレーション）</option>
                            <option>SyncInsight（意思決定インテリジェンス & 管制）</option>
                            <option>SyncEta（Vision-LLM UIテスト自動化）</option>
                            <option>SyncBoot（エンタープライズJava MSAバックエンド）</option>
                            <option>SyncCMS（グローバル多言語CMS）</option>
                            <option>SyncCrawl（適応型自律クローリング & RAG知識）</option>
                            <option>SyncLLM（エンタープライズAIゲートウェイ & FinOps）</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="message">お問い合わせ内容</label>
                        <textarea id="message" class="form-control" placeholder="導入対象のシステム環境や検討日程などをご記入ください。" required></textarea>
                    </div>
                    <div class="form-group" style="margin: 1.5rem 0; display: flex; align-items: flex-start; gap: 10px;">
                        <input type="checkbox" id="privacyConsent" required style="width: 18px; height: 18px; margin-top: 3px; cursor: pointer; accent-color: var(--primary-color);">
                        <label for="privacyConsent" style="color: #cbd5e1; font-size: 0.9rem; line-height: 1.5; cursor: pointer;">
                            <strong>[必須]</strong> お問い合わせ対応のための<a href="../../ja/pages/privacy.html" target="_blank" style="color: var(--primary-color); text-decoration: underline;">プライバシーポリシー</a>に同意します。
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary submit-btn">送信する</button>
                </form>
            </div>
        </section>
    </main>

    {{> footer_ja }}
    <script type="module" src="/assets/js/i18n.js"></script>
    <script type="module" src="/assets/js/main.js"></script>
    <script type="module" src="/assets/js/contact.js"></script>
</body>
</html>
