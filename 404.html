<!DOCTYPE html>
<html>

<head>
    <title>엠파시(Empasy) | 메인 페이지로 이동 중...</title>
    <meta name="description" content="엠파시(Empasy) 엔터프라이즈 AI 통합 플랫폼">
    <meta charset="UTF-8">
    <script>
        (function () {
            var path = window.location.pathname.toLowerCase();
            if (path.includes('synceta')) {
                window.location.replace('/solutions/sync-eta.html');
            } else {
                var lang = navigator.language || navigator.userLanguage || '';
                var target = '/ko/pages/index.html';
                if (lang.startsWith('en')) {
                    target = '/en/pages/index.html';
                } else if (lang.startsWith('ja')) {
                    target = '/ja/pages/index.html';
                }
                window.location.replace(target);
            }
        })();
    </script>
    <meta http-equiv="refresh" content="0; url=/ko/pages/index.html">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>

<body>
    <p>요청하신 페이지를 찾을 수 없습니다. 메인 페이지로 이동합니다 (302 Redirect)...</p>
</body>

</html>
