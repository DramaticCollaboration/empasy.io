    <title>엠파시(Empasy) | 메인 페이지로 이동 중...</title>

    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://empasy.io/">
    <meta charset="UTF-8">
    <script>
        (function () {
            var rawPath = window.location.pathname;
            var path = rawPath.toLowerCase();
            if (path.indexOf('/docs/') === 0 || path === '/docs') {
                var docSubPath = rawPath.replace(/^\/docs(\/(ko|en|ja))?/i, '') || '/';
                window.location.replace('https://doc.empasy.com' + docSubPath);
            } else if (path.includes('synceta')) {
                window.location.replace('/ko/solutions/sync-eta.html');
            } else if (path === '/en' || path === '/en/') {
                window.location.replace('/en/pages/index.html');
            } else if (path === '/ja' || path === '/ja/') {
                window.location.replace('/ja/pages/index.html');
            } else {
                var preferred = '';
                try { preferred = localStorage.getItem('preferred_lang') || ''; } catch (e) {}
                var target = '/';
                if (preferred === 'en') {
                    target = '/en/pages/index.html';
                } else if (preferred === 'ja') {
                    target = '/ja/pages/index.html';
                }
                window.location.replace(target);
            }
        })();
    </script>
