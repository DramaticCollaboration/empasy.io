<script>
(function () {
    var nav = document.querySelector('.glass-header .nav-container');
    if (!nav || nav.dataset.empNavBound === 'true') return;
    nav.dataset.empNavBound = 'true';
    var btn = nav.querySelector('.mobile-menu-btn');
    var links = nav.querySelector('.nav-links');
    var actions = nav.querySelector('.nav-actions');
    var setOpen = function (open) {
        nav.classList.toggle('active', open);
        if (links) links.classList.toggle('active', open);
        if (actions) actions.classList.toggle('active', open);
        document.documentElement.classList.toggle('mobile-menu-open', open);
        document.body.classList.toggle('mobile-menu-open', open);
        if (btn) {
            btn.setAttribute('aria-expanded', open ? 'true' : 'false');
            btn.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
        }
        if (!open) nav.scrollTop = 0;
    };
    if (btn) {
        btn.addEventListener('click', function () {
            setOpen(!nav.classList.contains('active'));
        });
    }
    nav.querySelectorAll('.dropdown > .dropbtn').forEach(function (drop) {
        drop.addEventListener('click', function (e) {
            if (window.innerWidth <= 1023) {
                e.preventDefault();
                var parent = drop.parentElement;
                nav.querySelectorAll('.dropdown').forEach(function (d) {
                    if (d !== parent) d.classList.remove('open');
                });
                parent.classList.toggle('open');
            }
        });
    });
    nav.querySelectorAll('a:not(.dropbtn)').forEach(function (a) {
        a.addEventListener('click', function () {
            if (window.innerWidth <= 1023 && nav.classList.contains('active')) {
                setOpen(false);
            }
        });
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && nav.classList.contains('active')) setOpen(false);
    });
    window.addEventListener('resize', function () {
        if (window.innerWidth > 1023 && nav.classList.contains('active')) setOpen(false);
    });
    var syncEmpasyLocaleCookies = function (lang) {
        var siteLocale = lang === 'en' ? 'en-US' : (lang === 'ja' ? 'ja-JP' : 'ko-KR');
        var adminLocale = lang === 'ko' ? 'ko-KR' : 'en-US';
        var host = window.location.hostname || '';
        var domainPart = (host === 'empasy.io' || host.endsWith('.empasy.io')) ? '; domain=.empasy.io' : '';
        var securePart = window.location.protocol === 'https:' ? '; Secure' : '';
        var attrs = '; path=/; max-age=31536000; SameSite=Lax' + domainPart + securePart;
        try {
            document.cookie = 'empasy_site_locale=' + encodeURIComponent(siteLocale) + attrs;
            document.cookie = 'empasy_locale=' + encodeURIComponent(adminLocale) + attrs;
        } catch (err) {}
    };
    syncEmpasyLocaleCookies('ko');
    var path = window.location.pathname || '/';
    var m = path.match(/\/(ko|en|ja)\/(.*)/);
    nav.querySelectorAll('.lang-switch a[data-lang]').forEach(function (a) {
        if (a.dataset.langBound === 'true') return;
        a.dataset.langBound = 'true';
        var target = a.getAttribute('data-lang');
        var url = target === 'ko' ? '/' : '/' + target + '/pages/index.html';
        if (m) {
            var sub = m[2] || 'pages/index.html';
            if (target === 'ko' && (sub === 'pages/index.html' || sub === 'pages/' || sub === '')) {
                url = '/';
            } else {
                url = '/' + target + '/' + sub;
            }
        }
        a.setAttribute('href', url);
        a.addEventListener('click', function () {
            try { localStorage.setItem('preferred_lang', target); } catch (err) {}
            syncEmpasyLocaleCookies(target);
        });
    });
})();
</script>
