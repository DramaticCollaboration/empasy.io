<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Us | Empasy - Enterprise AI & Test Automation</title>
    <meta name="description" content="Get in touch with Empasy for enterprise AI agents, test automation, and PoC inquiries.">
    <meta name="keywords" content="Empasy, Contact, Enterprise AI, SyncSeries, SyncEta, SyncBoot, Test Automation">
    <meta property="og:title" content="Contact Us | Empasy">
    <meta property="og:description" content="Get in touch with Empasy for enterprise AI agents, test automation, and PoC inquiries.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://empasy.io/en/pages/contact.html">
    <meta property="og:image" content="https://empasy.io/empasy-logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Contact Us | Empasy">
    <meta name="twitter:description" content="Get in touch with Empasy for enterprise AI agents and QA solutions.">
    <meta name="twitter:image" content="https://empasy.io/empasy-logo.png">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        .page-header { padding: 150px 0 80px; text-align: center; }
        .page-title { font-size: 3rem; margin-bottom: 1rem; color: var(--text-primary); }
        .page-subtitle { font-size: 1.2rem; color: var(--text-secondary); max-width: 800px; margin: 0 auto; }
        .contact-form {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            padding: clamp(1.2rem, 5vw, 3rem);
            border-radius: var(--border-radius);
            max-width: 800px;
            margin: 0 auto 5rem;
        }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; margin-bottom: 0.5rem; color: #fff; font-weight: 600; }
        .form-control {
            width: 100%;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius-sm);
            color: #fff;
            font-family: inherit;
        }
        .form-control:focus { outline: none; border-color: var(--primary-color); background: rgba(0, 0, 0, 0.4); }
        textarea.form-control { min-height: 150px; resize: vertical; }
        .submit-btn { width: 100%; padding: 1rem; font-size: 1.1rem; margin-top: 1rem; }
    </style>
</head>
<body>
    {{> header_en }}

    <main class="container">
        <div class="page-header fade-in-up">
            <h1 class="page-title">Contact Us</h1>
            <p class="page-subtitle">Design your autonomous engineering and QA roadmap with Empasy experts.</p>
            
            <div style="margin-top: 2rem; display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap;">
                <div style="background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 1rem 1.5rem; text-align: left; display: flex; align-items: center; gap: 12px;">
                    <span style="background: rgba(37, 99, 235, 0.2); color: #60a5fa; padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 0.85rem;">Inquiries</span>
                    <a href="mailto:poh@empasy.com" style="color: #fff; font-weight: 600; text-decoration: none; font-size: 1.05rem;">poh@empasy.com</a>
                </div>
                <div style="background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 1rem 1.5rem; text-align: left; display: flex; align-items: center; gap: 12px;">
                    <span style="background: rgba(16, 185, 129, 0.2); color: #34d399; padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 0.85rem;">Tech Support</span>
                    <a href="tel:+82-507-1360-8169" style="color: #fff; font-weight: 600; text-decoration: none; font-size: 1.05rem;">+82-507-1360-8169</a>
                </div>
            </div>
        </div>

        <section class="section pt-0 fade-in-up delay-1">
            <div class="contact-form glass-card">
                <form id="contactForm">
                    <div class="grid grid-2">
                        <div class="form-group">
                            <label class="form-label" for="name">Name / Job Title</label>
                            <input type="text" id="name" class="form-control" placeholder="John Doe / Team Lead" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="company">Company Name</label>
                            <input type="text" id="company" class="form-control" placeholder="Empasy Inc." required>
                        </div>
                    </div>
                    <div class="grid grid-2">
                        <div class="form-group">
                            <label class="form-label" for="email">Work Email</label>
                            <input type="email" id="email" class="form-control" placeholder="example@company.com" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="phone">Phone Number</label>
                            <input type="tel" id="phone" class="form-control" placeholder="+1-000-000-0000" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="interest">Solutions of Interest</label>
                        <select id="interest" class="form-control" style="background: rgba(0, 0, 0, 0.4);">
                            <option>All (Sync Series Autonomous Operations Ecosystem)</option>
                            <option>SyncVerse (Multi-Agent A2A Orchestration)</option>
                            <option>SyncInsight (Decision Intelligence & Analytics)</option>
                            <option>SyncEta (Vision-LLM UI Test Automation)</option>
                            <option>SyncBoot (Enterprise Java MSA Backend)</option>
                            <option>SyncCMS (Global Multi-Language CMS)</option>
                            <option>SyncCrawl (Adaptive Crawling & RAG Pipeline)</option>
                            <option>SyncLLM (Enterprise AI Gateway & FinOps)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="message">Message</label>
                        <textarea id="message" class="form-control" placeholder="Please describe your system environment, timeline, and inquiry details." required></textarea>
                    </div>
                    <div class="form-group" style="margin: 1.5rem 0; display: flex; align-items: flex-start; gap: 10px;">
                        <input type="checkbox" id="privacyConsent" required style="width: 18px; height: 18px; margin-top: 3px; cursor: pointer; accent-color: var(--primary-color);">
                        <label for="privacyConsent" style="color: #cbd5e1; font-size: 0.9rem; line-height: 1.5; cursor: pointer;">
                            <strong>[Required]</strong> I agree to the <a href="../../en/pages/privacy.html" target="_blank" style="color: var(--primary-color); text-decoration: underline;">Privacy Policy</a> for inquiry handling and consultation.
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary submit-btn">Submit Inquiry</button>
                </form>
            </div>
        </section>
    </main>

    {{> footer_en }}
    <script type="module" src="/assets/js/i18n.js"></script>
    <script type="module" src="/assets/js/main.js"></script>
    <script type="module" src="/assets/js/contact.js"></script>
</body>
</html>
