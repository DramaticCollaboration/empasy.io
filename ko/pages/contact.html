<!DOCTYPE html>
<html lang="ko">
<head>
    <title>도입 및 기술 문의 (Contact) | 엠파시(Empasy)</title>
    <meta name="description" content="엠파시(Empasy)의 엔터프라이즈 AI 솔루션 및 테스트 자동화 도구 도입에 대해 문의하세요.">
    <meta name="keywords" content="엠파시, 도입 문의, 기술 문의, 엔터프라이즈 PoC, SyncSeries, SyncEta, SyncBoot">
    <meta property="og:title" content="도입 및 기술 문의 (Contact) | 엠파시(Empasy)">
    <meta property="og:description" content="엠파시(Empasy)의 엔터프라이즈 AI 솔루션 및 테스트 자동화 도구 도입에 대해 문의하세요.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://empasy.io/ko/pages/contact.html">
    <meta property="og:image" content="https://empasy.io/empasy-logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        .page-header { padding: 150px 0 80px; text-align: center; }
        .page-title { font-size: 3rem; margin-bottom: 1rem; color: var(--text-primary); }
        .page-subtitle { font-size: 1.2rem; color: var(--text-secondary); max-width: 800px; margin: 0 auto; }
        .contact-form {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            padding: clamp(1.2rem, 5vw, 3rem);
            border-radius: var(--border-radius);
            max-width: 800px;
            margin: 0 auto 5rem;
        }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; margin-bottom: 0.5rem; color: #fff; font-weight: 600; }
        .form-control {
            width: 100%;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius-sm);
            color: #fff;
            font-family: inherit;
        }
        .form-control:focus { outline: none; border-color: var(--primary-color); background: rgba(0, 0, 0, 0.4); }
        textarea.form-control { min-height: 150px; resize: vertical; }
        .submit-btn { width: 100%; padding: 1rem; font-size: 1.1rem; margin-top: 1rem; }
    </style>
    <meta name="geo.region" content="KR-11" />
    <meta name="geo.placename" content="Seoul" />
    <meta name="geo.position" content="37.5665;126.9780" />
    <meta name="ICBM" content="37.5665, 126.9780" />
    <!-- SEO Tags -->
    <link rel="canonical" href="https://empasy.io/ko/pages/contact.html">
    <link rel="alternate" hreflang="ko" href="https://empasy.io/ko/pages/contact.html" />
    <link rel="alternate" hreflang="en" href="https://empasy.io/en/pages/contact.html" />
    <link rel="alternate" hreflang="ja" href="https://empasy.io/ja/pages/contact.html" />
    <link rel="alternate" hreflang="x-default" href="https://empasy.io/ko/pages/contact.html" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
    {{> header_ko }}

    <main class="container">
        <div class="page-header fade-in-up">
            <h1 class="page-title">도입 및 기술 문의</h1>
            <p class="page-subtitle">엔터프라이즈 환경에 적합한 솔루션 도입과 PoC 진행 방안을 안내해 드립니다.</p>
            
            <div style="margin-top: 2rem; display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap;">
                <div style="background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 1rem 1.5rem; text-align: left; display: flex; align-items: center; gap: 12px;">
                    <span style="background: rgba(37, 99, 235, 0.2); color: #60a5fa; padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 0.85rem;">도입 문의</span>
                    <a href="mailto:poh@empasy.com" style="color: #fff; font-weight: 600; text-decoration: none; font-size: 1.05rem;">poh@empasy.com</a>
                </div>
                <div style="background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 1rem 1.5rem; text-align: left; display: flex; align-items: center; gap: 12px;">
                    <span style="background: rgba(16, 185, 129, 0.2); color: #34d399; padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 0.85rem;">기술 지원</span>
                    <a href="tel:0507-1360-8169" style="color: #fff; font-weight: 600; text-decoration: none; font-size: 1.05rem;">0507-1360-8169</a>
                </div>
            </div>
        </div>

        <section class="section pt-0 fade-in-up delay-1">
            <div class="contact-form glass-card">
                <form id="contactForm">
                    <div class="grid grid-2">
                        <div class="form-group">
                            <label class="form-label" for="name">이름 / 직급</label>
                            <input type="text" id="name" class="form-control" placeholder="홍길동 / 팀장" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="company">회사명</label>
                            <input type="text" id="company" class="form-control" placeholder="주식회사 엠파시" required>
                        </div>
                    </div>
                    <div class="grid grid-2">
                        <div class="form-group">
                            <label class="form-label" for="email">이메일</label>
                            <input type="email" id="email" class="form-control" placeholder="example@company.com" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="phone">연락처</label>
                            <input type="tel" id="phone" class="form-control" placeholder="010-0000-0000" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="interest">관심 솔루션</label>
                        <select id="interest" class="form-control" style="background: rgba(0, 0, 0, 0.4);">
                            <option>전체 (Sync Series 통합 자율 운영 생태계)</option>
                            <option>SyncVerse (멀티 에이전트 A2A 오케스트레이션)</option>
                            <option>SyncInsight (의사결정 인텔리전스 & 관제)</option>
                            <option>SyncEta (Vision-LLM UI 테스트 자동화)</option>
                            <option>SyncBoot (엔터프라이즈 Java MSA 백엔드)</option>
                            <option>SyncCMS (글로벌 다국어 퍼블리싱 CMS)</option>
                            <option>SyncCrawl (적응형 자율 크롤링 & RAG 지식)</option>
                            <option>SyncLLM (AI 게이트웨이 & FinOps 통제)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="message">문의 내용</label>
                        <textarea id="message" class="form-control" placeholder="도입 대상 시스템 환경, 검토 일정 등 문의 내용을 작성해주세요." required></textarea>
                    </div>
                    <div class="form-group" style="margin: 1.5rem 0; display: flex; align-items: flex-start; gap: 10px;">
                        <input type="checkbox" id="privacyConsent" required style="width: 18px; height: 18px; margin-top: 3px; cursor: pointer; accent-color: var(--primary-color);">
                        <label for="privacyConsent" style="color: #cbd5e1; font-size: 0.9rem; line-height: 1.5; cursor: pointer;">
                            <strong>[필수]</strong> 문의 접수 및 기술 상담을 위한 <a href="../../ko/pages/privacy.html" target="_blank" style="color: var(--primary-color); text-decoration: underline;">개인정보 수집 및 이용</a>에 동의합니다.
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary submit-btn">문의 접수하기</button>
                </form>
            </div>
        </section>
    </main>

    {{> footer_ko }}
    <script type="module" src="/assets/js/i18n.js"></script>
    <script type="module" src="/assets/js/main.js"></script>
    <script type="module" src="/assets/js/contact.js"></script>
</body>
</html>
