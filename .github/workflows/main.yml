name: Deploy Static Homepage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build Main Site
        run: pnpm run build

      - name: Assemble Final Build
        run: |
          # Copy required static files to dist
          cp CNAME dist/ || true
          cp robots.txt dist/ || true
          cp sitemap.xml dist/ || true
          cp llms.txt dist/ || true

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GIT_TOKEN || secrets.GITHUB_TOKEN }}
          publish_dir: dist
