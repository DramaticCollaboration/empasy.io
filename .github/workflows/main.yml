name: Deploy Static Homepage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Build Main Site
        run: |
          npm install
          npm run build

      - name: Build Docs
        run: |
          cd docs
          pnpm install
          pnpm run docs:build
          cd ..
          
      - name: Assemble Final Build
        run: |
          # Move docs build to main site dist
          rm -rf ./dist/docs
          mkdir -p ./dist/docs
          mv docs/.vitepress/dist/* ./dist/docs/
          
          # Copy required static files to dist
          cp CNAME dist/ || true
          cp robots.txt dist/ || true
          cp sitemap.xml dist/ || true

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GIT_TOKEN }}
          publish_dir: dist

