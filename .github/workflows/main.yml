name: Deploy Static Homepage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Build Docs
        run: |
          cd docs
          pnpm install
          pnpm run docs:build
          cd ..
          
          # Replace raw docs folder with built dist
          mv docs/.vitepress/dist ./docs_dist
          rm -rf docs
          mv docs_dist docs

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GIT_TOKEN }}
          publish_dir: .

